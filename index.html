<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4ECDF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Pacto — planificador semanal compartido para dos, con tareas, revisión diaria y copias de seguridad.">
<meta name="application-name" content="Pacto">
<title>Pacto · planificador de dos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%23B07A3E'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%236F7F5B' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Tema antes del primer pintado (evita parpadeos) */
(function(){
  var pref='auto';
  try{ pref=localStorage.getItem('pacto.theme')||'auto'; }catch(e){}
  var dark = pref==='dark' || (pref==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var r=document.documentElement; r.dataset.theme=dark?'dark':'light'; r.dataset.pref=pref;
  var m=document.querySelector('meta[name=theme-color]'); if(m) m.content=dark?'#17100C':'#F4ECDF';
})();
</script>
<style>
:root{
  --display:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F4ECDF; --bg-2:#EADFCC; --surface:#FBF7EF; --surface-2:#F2E8D7;
  --ink:#2B1E15; --ink-2:#5E4939; --ink-3:#8D7966;
  --line:rgba(43,30,21,.11); --line-2:rgba(43,30,21,.22);
  --accent:#7B4F2D; --accent-2:#5F3B21; --accent-ink:#FFF8EC;
  --a:#B07A3E; --b:#6F7F5B;
  --danger:#9B3B2B; --ok:#5E7B4A;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 14px 34px -18px rgba(70,40,15,.35);
  --grain:.30; --blend:multiply;
}
[data-theme=dark]{
  --bg:#17100C; --bg-2:#201611; --surface:#261A14; --surface-2:#30221A;
  --ink:#F2E7D5; --ink-2:#CDB89E; --ink-3:#917E6B;
  --line:rgba(242,231,213,.09); --line-2:rgba(242,231,213,.2);
  --accent:#D1A06A; --accent-2:#E2B887; --accent-ink:#1B110B;
  --a:#D4A35F; --b:#9DB087;
  --danger:#D9806C; --ok:#9DB87F;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -18px rgba(0,0,0,.7);
  --grain:.10; --blend:screen;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);line-height:1.45;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);mix-blend-mode:var(--blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .14  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.muted{color:var(--ink-3);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;max-width:1240px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px;letter-spacing:-.01em;font-weight:500}
.logo{position:relative;width:30px;height:22px;display:inline-block}
.logo::before,.logo::after{content:"";position:absolute;top:0;width:22px;height:22px;border-radius:50%}
.logo::before{left:0;background:var(--a)}
.logo::after{right:0;background:var(--b);opacity:.85;mix-blend-mode:multiply}
[data-theme=dark] .logo::after{mix-blend-mode:screen;opacity:.7}
.top-r{display:flex;align-items:center;gap:8px}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.sync.busy i{background:var(--a);animation:pulse 1.2s infinite}
.sync.off i{background:var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);transition:.2s}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink)}

#nav{position:fixed;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:24px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow)}
#nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:0;background:transparent;border-radius:18px;color:var(--ink-3);font-size:11px;font-weight:500;min-width:0;transition:.2s}
#nav button span.lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav button[aria-current=page]{background:var(--bg-2);color:var(--ink)}
#nav button[aria-current=page] svg{stroke:var(--accent)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 14px 28px -10px rgba(70,35,10,.6);transition:transform .2s}
.fab:active{transform:scale(.93)}
.fab svg{width:26px;height:26px;stroke-width:2}
#app.ob #nav,#app.ob .fab,#app.ob .top-r{display:none}

main#view{position:relative;max-width:1240px;margin:0 auto;padding:10px 18px 150px}
main#view.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}

.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.015em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:21px;margin-bottom:6px}
.stack{display:grid;gap:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 12px}
.sec-h h2{font-size:26px;font-weight:350}
.sec-h .muted{font-size:13px}

/* Hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:14px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.hero-day{font-size:clamp(56px,15vw,118px);font-weight:300;font-style:italic;line-height:.9;letter-spacing:-.035em;margin:10px 0 6px}
.hero-date{font-family:var(--display);font-size:clamp(18px,3.4vw,24px);color:var(--ink-2);font-weight:350;padding-bottom:16px}
.ring{position:relative;width:104px;height:104px;flex:none;margin-bottom:14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:var(--line-2)}
.ring .pg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--display);font-size:30px;font-weight:400;line-height:1}
.ring-c span{font-size:10.5px;color:var(--ink-3);margin-top:3px;max-width:62px;line-height:1.15}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.stat{padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.balance{margin:16px 0 24px;padding:17px 18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 7%,var(--surface)),var(--surface) 54%,color-mix(in srgb,var(--b) 8%,var(--surface)));box-shadow:var(--shadow)}
.balance-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:13px}
.balance-head h3{font-size:21px;margin-top:2px}
.balance-head .tag{white-space:nowrap}
.balance-people{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.balance-person{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--surface) 82%,transparent)}
.balance-id{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:500}
.balance-id span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.balance-dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.balance-person strong{font-family:var(--display);font-size:23px;font-weight:400;white-space:nowrap}
.balance-person small{font:500 11px var(--ui);color:var(--ink-3)}
.balance-track{display:flex;gap:3px;height:8px;overflow:hidden;border-radius:99px;background:var(--bg-2);margin-top:13px}
.balance-track span{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.balance-a{background:var(--a)}.balance-b{background:var(--b)}
.balance-note{font-size:13px;color:var(--ink-2);margin-top:10px}
.balance-note span{color:var(--ink-3)}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:400;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-3)}

/* Alertas */
.alerts{display:grid;gap:10px;margin:16px 0 0}
.alert{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid color-mix(in srgb,var(--danger) 38%,transparent);background:color-mix(in srgb,var(--danger) 9%,var(--surface))}
.alert.soft{border-color:var(--line);background:var(--surface)}
.alert b{display:block;font-weight:600;font-size:15px}
.alert span{font-size:13px;color:var(--ink-3)}

/* Tareas */
.tasks{list-style:none;display:grid;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,background .2s;position:relative}
.task::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--accent));opacity:.9}
.task:hover{border-color:var(--line-2)}
.check{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line-2);background:transparent;color:transparent;display:grid;place-items:center;flex:none;transition:.25s}
.check:hover{border-color:var(--c,var(--accent))}
.check svg,.mark svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.check svg path,.mark svg path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s .05s}
.mark{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line-2);display:grid;place-items:center;flex:none;color:transparent}
.is-done .check,.is-done .mark{background:var(--c,var(--accent));border:1.6px solid var(--c,var(--accent));color:var(--accent-ink)}
.is-done .check path,.is-done .mark path{stroke-dashoffset:0}
.is-done .t-title{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.is-late{border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.is-late .mark,.is-late .check{border-color:var(--danger)}
.pop .check{animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.task-body{flex:1;min-width:0;display:grid;gap:3px;text-align:left;border:0;background:transparent;padding:2px 0}
.t-title{font-size:16px;font-weight:500;overflow-wrap:break-word;word-break:normal;hyphens:auto}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--ink-3)}
.t-meta .m{display:inline-flex;align-items:center;gap:4px}
.t-meta svg.i{width:13px;height:13px}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--bg-2);color:var(--ink-2)}
.tag-late{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.tag-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--accent)}
.empty{padding:26px 18px;text-align:center;border:1px dashed var(--line-2);border-radius:20px;color:var(--ink-3);font-size:14.5px}
.empty b{display:block;font-family:var(--display);font-size:20px;font-weight:400;color:var(--ink-2);margin-bottom:4px}

.two{display:grid;gap:18px}
@media(min-width:900px){.two{grid-template-columns:1.25fr 1fr;align-items:start}}

.who{display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:17px;flex:none}
[data-theme=dark] .av{color:#1B110B}
.bar{height:6px;border-radius:9px;background:var(--bg-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mini-list{list-style:none;display:grid;gap:2px;margin-top:12px}
.mini-list li{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.mini-list li:first-child{border-top:0}
.mini-list .st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.mini-list li.d .st{background:var(--c);border-color:var(--c)}
.mini-list li.d span.tx{color:var(--ink-3);text-decoration:line-through}
.mini-list li.l .st{border-color:var(--danger)}
.mini-list time{margin-left:auto;font-size:12px;color:var(--ink-3)}
.next-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}

/* Semana */
.wk-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding:14px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.wk-head h1{font-size:clamp(34px,7vw,58px);font-weight:300;font-style:italic;line-height:1;margin:8px 0 12px;letter-spacing:-.03em}
.wk-nav{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:99px;border:1px solid transparent;font-weight:600;font-size:14.5px;transition:.2s;white-space:nowrap}
.btn svg.i{width:18px;height:18px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-soft{background:var(--bg-2);color:var(--ink)}
.btn-soft:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:8px 14px;font-size:13.5px}
.btn-lg{padding:15px 26px;font-size:16px}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px}
.desk-only{display:none}
.week{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.week{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
@media(min-width:1200px){.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 12px 12px}
.day.today{border-color:var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface) 70%)}
.day.past{opacity:.86}
.day-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding:0 4px}
.day-h .dw{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.day.today .dw{color:var(--accent)}
.day-h .num{font-family:var(--display);font-size:30px;font-weight:350;line-height:1}
.day-h .cnt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.mini-add{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink-3);display:grid;place-items:center;transition:.2s}
.mini-add:hover{color:var(--ink);border-color:var(--ink-3)}
.mini-add svg{width:14px;height:14px}
.day .tasks{gap:6px}
.day .task{padding:9px 10px 9px 10px;border-radius:14px;gap:9px}
.day .task::before{top:11px;bottom:11px}
.day .check{width:26px;height:26px}
.day .mark{width:22px;height:22px}
.day .t-title{font-size:14.5px;line-height:1.25}
.day .tag-late{display:none}
@media(min-width:1200px){.day{padding:12px 8px 10px}.day .task{padding:8px 8px 8px 9px;gap:8px}.day .t-title{font-size:14px}.day-h .num{font-size:26px}}
.day .t-meta{font-size:11.5px}
.free{font-size:13px;color:var(--ink-3);padding:6px 4px;font-style:italic;font-family:var(--display)}

/* Formularios y capas */
.layer{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(24,13,7,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.sheet{width:100%;max-width:580px;max-height:94dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:slide .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px -20px rgba(0,0,0,.5)}
.sheet-sm{max-width:420px}
.sheet-lg{max-width:680px}
@media(min-width:720px){.layer{align-items:center;padding:20px}.sheet{border-radius:28px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.sheet-title{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:-.02em}
.field{display:grid;gap:7px;margin:16px 0}
.field>span,.field>label>span{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field textarea,.field select,.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--bg);font-size:16px;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.field .hint{font-size:13px;color:var(--ink-3);text-transform:none;letter-spacing:0;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--bg-2);border-radius:15px;padding:3px;gap:2px}
.seg button{flex:1;padding:10px 8px;border-radius:12px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
.seg button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
(() => {

   ============================================================ */

const mondayOf = s => addDays(s, -wd(s));
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const isoWeek = s => {

const COST_LABEL = {1:'Ligera',2:'Sencilla',3:'Media',4:'Pesada',5:'Dura'};

};
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.5"/></svg>';

/* ============================================================
   Estado, configuración y persistencia
   ============================================================ */
const LS = { cfg: 'pacto.cfg.v1', state: 'pacto.state.v1', pending: 'pacto.pending.v1', theme: 'pacto.theme' };

const DEFAULT_BANK = [
  ['Sacar la basura', 1], ['Poner y recoger la mesa', 1], ['Hacer la cama y ordenar la habitación', 1],

  ['Limpiar el baño', 4], ['Limpiar la cocina a fondo', 4], ['Aspirar y fregar toda la casa', 5]

const defaultBank = () => { const b = {}; DEFAULT_BANK.forEach(([title, cost], i) => { b['k' + (i + 1)] = { title, cost }; }); return b; };

function normalize(s) {
  if (!s || typeof s !== 'object' || Array.isArray(s)) s = {};
  if (!s.meta || typeof s.meta !== 'object') s.meta = {};
  s.meta.names = Object.assign({ a: 'Yo', b: 'Mi pareja' }, s.meta.names || {});

function sanitizeBackupState(raw) {

  s.meta.names = names;
  for (const [id, t] of Object.entries(s.tasks)) {
    if (!/^[A-Za-z0-9_-]{1,100}$/.test(id) || !t || typeof t !== 'object' || Array.isArray(t) || String(t.id || '') !== id || !['a','b'].includes(t.owner) || !['daily','days','once','flex'].includes(t.type) || typeof t.title !== 'string' || !t.title.trim()) { delete s.tasks[id]; continue; }

let cfg = load(LS.cfg, null);                 // {mode:'local'|'sync', dbUrl, room, me:'a'|'b'}

const oth = s => (s === 'a' ? 'b' : 'a');
const nm = s => S.meta.names[s] || (s === 'a' ? 'Yo' : 'Mi pareja');

function setPath(obj, parts, val) {
  if (!parts.length) return;

/* ============================================================
   Lógica de tareas
   ============================================================ */
const taskDays = t => String(t.days == null ? '' : t.days).split(',').filter(x => x !== '').map(Number);

/* ---------- Revisión de medianoche ---------- */
function runReview() {
  if (!cfg || !Sync.ready) return;
  const today = todayStr(), yesterday = addDays(today, -1);
  const last = S.lastReview;
  if (!last) { commit({ lastReview: yesterday }); return; }
  if (last >= yesterday) return;
  const from = addDays(last, 1);
  // Revisa en bloques para no congelar móviles con una cola larga; el cursor avanza solo por días procesados.
  const span = diffDays(from, yesterday);
  const through = span >= 90 ? addDays(from, 89) : yesterday;
  const u = {}, created = [];
  const chain = S.meta.settings.chain !== false;
  for (let d = from; d <= through; d = addDays(d, 1)) {
    for (const t of allTasks()) {
      let kd = null;
      if (t.type === 'flex') {
        if (wd(d) === 6) { const mon = mondayOf(d); if (flexApplies(t, mon)) kd = mon; }
      } else if (occursOn(t, d)) kd = d;
      if (!kd) continue;
      if (S.done[doneKey(t, kd)]) continue;
      if (t.origin === 'punishment' && !chain) continue;
      const pid = punishId(t, kd);
      if (S.punish[pid]) continue;
      const debtor = effectiveOwner(t, kd);
      const p = { id: pid, debtor, creditor: oth(debtor), taskId: t.id, title: t.title, date: d, cost: costOf(t), status: 'pending', at: nowMs() };
      if (t.type === 'flex') p.flex = 1;

}

  const mine = list.filter(p => p.debtor === me);
  if (toImpose.length) notify(`${nm(oth(me))} no completó ${toImpose.length === 1 ? '«' + toImpose[0].title + '»' : toImpose.length + ' tareas'}`, 'Te toca elegir el castigo.', true);

  html += `<section class="balance" style="--i:2.5" aria-label="Equilibrio de tareas de esta semana"><div class="balance-head"><div><p class="eyebrow">REPARTO DE LA SEMANA</p><h3>El esfuerzo, entre los dos</h3></div><span class="tag">${effortTotal ? `${effortTotal} puntos` : 'Por planificar'}</span></div><div class="balance-people"><div class="balance-person"><div class="balance-id"><i class="balance-dot" style="--c:var(--a)"></i><span>${esc(nm('a'))}</span></div><strong>${effortA} <small>pts</small></strong></div><div class="balance-person"><div class="balance-id"><i class="balance-dot" style="--c:var(--b)"></i><span>${esc(nm('b'))}</span></div><strong>${effortB} <small>pts</small></strong></div></div><div class="balance-track" role="img" aria-label="${esc(nm('a'))}: ${effortA} puntos; ${esc(nm('b'))}: ${effortB} puntos"><span class="balance-a" style="width:${effortAWidth}%"></span><span class="balance-b" style="width:${effortTotal ? 100 - effortAWidth : 0}%"></span></div><p class="balance-note">${balanceText} <span>Cuenta el esfuerzo planificado, no solo el número de tareas.</span></p></section>`;

  if (empty) {
    html += `<div class="empty" style="margin-top:22px;--i:3"><b>Vuestro Pacto está vacío</b>Añade la primera tarea con el botón «+», o importa de golpe la planificación que tenéis en papel.<div class="row" style="justify-content:center;margin-top:14px"><button class="btn btn-primary" data-act="new">Nueva tarea</button><button class="btn btn-ghost" data-act="import-plan">Importar planificación</button></div></div>`;
  }
  html += `<div class="two" style="--i:3"><div>
      <div class="sec-h"><h2>Para hoy</h2><span class="muted">${my.length ? my.length + (my.length === 1 ? ' tarea' : ' tareas') : ''}</span></div>
      ${my.length ? tasksUL(my, t, {}) : `<div class="empty"><b>Nada previsto para hoy</b>Aprovecha el respiro.</div>`}
      ${flex.length ? `<div class="sec-h"><h2>Esta semana, cuando quieras</h2><span class="muted">${myFlexPending.length} pendiente${myFlexPending.length === 1 ? '' : 's'}</span></div>${tasksUL(flex, mon, { recur: false })}` : ''}

      ${next.length ? `<div class="next-chips">${next.map(x => `<span class="chip">${x.time ? esc(x.time) + ' · ' : ''}${esc(x.title)}</span>`).join('')}</div>` : '<p class="muted">Sin tareas para mañana.</p>'}
    </div>
    <div><div class="sec-h"><h2>${esc(nm(ot))}</h2><span class="muted">hoy</span></div>
      <div class="card"><div class="who">${avatar(ot)}<div style="flex:1;min-width:0"><b style="font-weight:600">${ods.total ? `${ods.done} de ${ods.total} hechas` : 'Sin tareas hoy'}</b><div class="muted" style="font-size:13px">${esc(nm(ot))}</div></div></div>
      <div class="bar" style="--c:var(--${ot})"><i style="width:${ods.total ? Math.round(ods.done / ods.total * 100) : 0}%"></i></div>
      ${ots.length ? `<ul class="mini-list" style="--c:var(--${ot})">${ots.map(x => `<li class="${isDone(x, t) ? 'd' : ''}"><span class="st"></span><span class="tx">${esc(x.title)}</span>${x.time ? `<time>${esc(x.time)}</time>` : ''}</li>`).join('')}</ul>` : ''}
      ${oy.length ? `<p style="margin-top:14px;font-size:13.5px;color:var(--danger)"><b>Ayer se le pasó:</b> ${oy.map(x => esc(x.title)).join(', ')}</p>` : ''}

  return html;
}

/* ---------- SEMANA ---------- */
function viewWeek(which) {
  const slot = which === 'mine' ? ME() : oth(ME());
  const mon = addDays(mondayOf(todayStr()), ui.off[which] * 7);
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(mon, i));
  const today = todayStr();
  const ws = weekStats(slot, mon), flex = flexFor(slot, mon);
  const a = parseD(days[0]), b = parseD(days[6]);
  const range = a.getMonth() === b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${MON[b.getMonth()]}` : `${a.getDate()} ${MON3[a.getMonth()]} – ${b.getDate()} ${MON3[b.getMonth()]}`;
  let missed = 0;
  days.forEach(d => { if (d < today) missed += missedOn(slot, d).length; });
  flex.forEach(t => { if (addDays(mon, 6) < today && !isDone(t, mon)) missed++; });
  const pctw = ws.total ? Math.round(ws.done / ws.total * 100) : 0;
  const rel = ui.off[which] === 0 ? 'Esta semana' : ui.off[which] === 1 ? 'Próxima semana' : ui.off[which] === -1 ? 'Semana pasada' : `Semana ${isoWeek(mon)}`;
  let html = `<section class="wk-head" style="--i:0"><div>
      <p class="eyebrow">${rel} · Semana ${isoWeek(mon)}</p>
      <h1>${range}</h1>
      <div class="who">${avatar(slot)}<div><b style="font-weight:600">${which === 'mine' ? 'Mis tareas' : 'Tareas de ' + esc(nm(slot))}</b><div class="muted" style="font-size:13px">${ws.done} de ${ws.total} hechas · ${pctw}%${missed ? ` · <span style="color:var(--danger)">${missed} sin hacer</span>` : ''}</div></div></div></div>
    <div class="wk-nav"><button class="icon-btn" data-act="week" data-d="-1" data-w="${which}" aria-label="Semana anterior">${ICON.left}</button>
      <button class="btn btn-soft btn-sm" data-act="week" data-d="0" data-w="${which}">Hoy</button>
      <button class="icon-btn" data-act="week" data-d="1" data-w="${which}" aria-label="Semana siguiente">${ICON.right}</button>
      <button class="btn btn-primary btn-sm" data-act="new" data-owner="${slot}">${ICON.plus}<span>Nueva</span></button></div></section>`;
  if (flex.length) html += `<div style="--i:1"><div class="sec-h" style="margin-top:4px"><h2>Cuando quieras esta semana</h2><span class="muted">${flex.filter(t => isDone(t, mon)).length}/${flex.length}</span></div>${tasksUL(flex, mon, { allowFuture: true })}<div style="height:16px"></div></div>`;
  html += `<div class="week" style="--i:2">${days.map(d => {
    const ts = tasksFor(slot, d), st = dayStats(slot, d);
    return `<section class="day${d === today ? ' today' : ''}${d < today ? ' past' : ''}" aria-label="${DOW[wd(d)]} ${parseD(d).getDate()}">
      <div class="day-h"><span class="dw">${DOW3[wd(d)]}</span><span class="num">${parseD(d).getDate()}</span>
        <span class="cnt">${st.total ? st.done + '/' + st.total : ''}</span>
        <button class="mini-add" data-act="new" data-owner="${slot}" data-date="${d}" aria-label="Añadir tarea el ${fmtShort(d)}">${ICON.plus}</button></div>
      ${ts.length ? tasksUL(ts, d, { allowFuture: true }) : '<p class="free">Libre</p>'}</section>`;
  }).join('')}</div>`;
  return html;
}

/* ---------- CASTIGOS ---------- */
function viewPunish() {
  const me = ME(), ot = oth(me), today = todayStr();
  const list = Object.values(S.punish);
  const toImpose = list.filter(p => p.creditor === me && p.status === 'pending').sort((a, b) => (a.at || 0) - (b.at || 0));
  const waiting = list.filter(p => p.debtor === me && p.status === 'pending');
  const pun = allTasks().filter(t => t.origin === 'punishment' && t.date >= addDays(today, -1) && !isDone(t, t.date));
  const mineT = pun.filter(t => t.owner === me).sort((a, b) => a.date.localeCompare(b.date));
  const theirT = pun.filter(t => t.owner === ot).sort((a, b) => a.date.localeCompare(b.date));
  const hist = list.filter(p => p.status !== 'pending').sort((a, b) => (b.resolvedAt || b.at || 0) - (a.resolvedAt || a.at || 0)).slice(0, 30);
  const cnt = s => list.filter(p => p.debtor === s && p.status === 'assigned').length;
  const stTag = p => p.status === 'assigned' ? '<span class="tag">Castigado</span>' : p.status === 'forgiven' ? '<span class="tag tag-ok">Perdonado</span>' : p.status === 'void' ? '<span class="tag tag-ok">Resuelta al completarla</span>' : '<span class="tag tag-ok">Resuelta</span>'; 
  const ptRow = t => `<li class="task" style="--c:var(--${t.owner === 'b' ? 'b' : 'a'})"><span class="mark" aria-hidden="true">${CHECK}</span><button class="task-body" data-act="${canEdit(t) ? 'edit' : 'view'}" data-id="${esc(t.id)}"><span class="t-title">${esc(t.title)}</span><span class="t-meta"><span class="m">${fmtShort(t.date)}</span>${dots(costOf(t))}</span></button></li>`;
  let html = `<section class="wk-head" style="--i:0"><div><p class="eyebrow">Reglas del juego</p><h1>Castigos</h1>
      <p class="muted" style="max-width:52ch">A medianoche se revisa lo que quedó sin hacer mientras Pacto esté abierto. Si ambos lo cerráis, recuperará los días pendientes la próxima vez que entréis. Quien impone el castigo elige tareas de coste equivalente.</p></div>
      <div class="wk-nav"><button class="btn btn-primary" data-act="impose">Imponer castigo a ${esc(nm(ot))}</button></div></section>`;
  html += `<div class="stats" style="--i:1"><div class="stat"><b>${toImpose.length}</b><span>por imponer</span></div><div class="stat"><b>${cnt(me)}</b><span>recibidos por ti</span></div><div class="stat"><b>${cnt(ot)}</b><span>recibidos por ${esc(nm(ot))}</span></div></div>`;
  html += `<div class="two" style="--i:2"><div>
    <div class="sec-h"><h2>Por imponer</h2></div>
    ${toImpose.length ? `<div class="alerts" style="margin:0">${toImpose.map(p => `<div class="alert"><div><b>${esc(nm(p.debtor))} no hizo «${esc(p.title)}»</b><span>${p.flex ? 'Semana del ' + fmtShort(mondayOf(p.date)) : fmtShort(p.date)} · esfuerzo ${costOf(p)}</span></div><div class="row"><button class="btn btn-primary btn-sm" data-act="impose" data-pid="${esc(p.id)}">Elegir</button><button class="btn btn-ghost btn-sm" data-act="forgive" data-pid="${esc(p.id)}">Perdonar</button></div></div>`).join('')}</div>` : '<div class="empty"><b>Todo en orden</b>No tienes castigos pendientes de imponer.</div>'}
    ${waiting.length ? `<div class="sec-h"><h2>Esperando a ${esc(nm(ot))}</h2></div><div class="alerts" style="margin:0">${waiting.map(p => `<div class="alert soft"><div><b>«${esc(p.title)}»</b><span>${fmtShort(p.date)} · ${esc(nm(ot))} elegirá tu castigo</span></div></div>`).join('')}</div>` : ''}
    <div class="sec-h"><h2>Mis castigos por cumplir</h2></div>
    ${mineT.length ? `<ul class="tasks">${mineT.map(ptRow).join('')}</ul>` : '<div class="empty">Ninguno. Así se hace.</div>'}
    ${theirT.length ? `<div class="sec-h"><h2>Castigos de ${esc(nm(ot))}</h2></div><ul class="tasks">${theirT.map(ptRow).join('')}</ul>` : ''}
  </div><div><div class="sec-h"><h2>Historial</h2></div>
    <div class="card">${hist.length ? `<ul class="hist">${hist.map(p => `<li><div><b>${esc(nm(p.debtor))}</b> · «${esc(p.title)}»<small>${fmtShort(p.date)}${p.manual ? ' · manual' : ''} · esfuerzo ${costOf(p)}</small></div>${stTag(p)}</li>`).join('')}</ul>` : '<p class="muted">Aún no hay historial.</p>'}</div></div></div>`;
  return html;
}

    <p class="muted" style="text-align:center;font-size:12.5px">Pacto · v1.1 · hecho a mano para dos</p>
  </div></div>`;
}

const DMAP = { l: 0, lu: 0, lun: 0, lunes: 0, m: 1, ma: 1, mar: 1, martes: 1, x: 2, mi: 2, mie: 2, miercoles: 2, j: 3, ju: 3, jue: 3, jueves: 3, v: 4, vi: 4, vie: 4, viernes: 4, s: 5, sa: 5, sab: 5, sabado: 5, d: 6, do: 6, dom: 6, domingo: 6 };

function parseWhen(raw) {
  const s = norm(raw); if (!s) return null;
  if (/^(diari[ao]s?|todos( los dias)?|cada dia|a diario)$/.test(s)) return { type: 'daily' };
  if (/^(semana|semanal|flexible|cualquier dia|1 vez por semana|una vez por semana|una vez a la semana)$/.test(s)) return { type: 'flex' };
  if (/^(laborables|entre semana|l-v|lun-vie|lunes a viernes|de lunes a viernes)$/.test(s)) return { type: 'days', days: [0, 1, 2, 3, 4] };
  if (/^(finde|findes|fin de semana|fines de semana|s-d)$/.test(s)) return { type: 'days', days: [5, 6] };
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) { const date = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`; return validYMD(date) ? { type: 'once', date } : null; }
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/);
  if (m) {
    const now = new Date(nowMs()); let y = m[3] ? +m[3] : now.getFullYear(); if (y < 100) y += 2000;
    let date = `${y}-${pad(+m[2])}-${pad(+m[1])}`;
    if (!m[3] && diffDays(date, todayStr()) > 60) date = `${y + 1}-${pad(+m[2])}-${pad(+m[1])}`;
    if (!validYMD(date)) return null;
    return { type: 'once', date };
  }

    const cells = (sep ? raw.split(sep) : [raw]).map(x => x.trim());
    if (idx === 0 && /^(tarea|titulo|título|nombre)/i.test(cells[0]) && cells.length > 1) return;

    const it = { line: raw, ok: false };
    if (!title) { it.error = 'Falta el título'; out.push(it); return; }
    if (cells.length < 2) { it.error = 'Faltan los días (separa con ; )'; out.push(it); return; }
    const when = parseWhen(whenRaw);
    if (!when) { it.error = `No entiendo «${whenRaw}»`; out.push(it); return; }
    let cost = 2;
    if (costRaw) { const n = parseInt(costRaw, 10); cost = !isNaN(n) ? Math.min(5, Math.max(1, n)) : (COSTW[norm(costRaw)] || 2); }

      else if (w === 'pareja' || w === 'ella' || w === 'el' || w === 'otro') owner = oth(ME());
      else if (w === norm(nm('a'))) owner = 'a';
      else if (w === norm(nm('b'))) owner = 'b';
      else if (norm(nm('a')).startsWith(w)) owner = 'a';
      else if (norm(nm('b')).startsWith(w)) owner = 'b';
      else { it.error = `Persona desconocida «${whoRaw}»`; out.push(it); return; }

    it.ok = true; it.task = Object.assign({ title, cost, owner, time }, when); out.push(it);
  });

}

    const l = openLayer(`<h2 class="sheet-title">Restaurar copia</h2><p class="muted" style="margin:10px 0 0;font-size:15px">La copia contiene ${n} tarea${n === 1 ? '' : 's'}${data.exportedAt ? ' (' + esc(String(data.exportedAt).slice(0, 10)) + ')' : ''}. ¿Cómo quieres aplicarla?</p>

      <div class="sheet-actions"><button class="btn btn-ghost" data-close>Cancelar</button></div>`, 'sheet-sm');

        commit({ '/': ns });
      } else {
        const u = {};
        // Fusionar significa añadir solo identificadores ausentes: una copia antigua nunca pisa datos actuales.
        for (const k of ['tasks', 'done', 'punish', 'bank']) for (const [id, v] of Object.entries(ns[k])) if (!Object.prototype.hasOwnProperty.call(S[k], id)) u[`${k}/${id}`] = v;

}

async function connectNew(url) {
  url = String(url || '').trim().replace(/\/+$/, '');
  if (!validFirebaseUrl(url)) throw new Error('Esa dirección no parece de Firebase Realtime Database. Debe empezar por https:// y terminar en firebasedatabase.app o firebaseio.com.');
  const room = randomRoom();
  const seed = clone(S); if (!seed.lastReview) seed.lastReview = addDays(todayStr(), -1);
  let res;
  try { res = await fetchT(`${url}/rooms/${room}.json`, { method: 'PUT', headers: JSONH, body: JSON.stringify(seed) }); }
  catch (e) { throw new Error('No se pudo conectar. Revisa la dirección y tu conexión.'); }
  if (res.status === 401 || res.status === 403) throw new Error('La base de datos rechaza la escritura. Comprueba que has publicado las reglas del paso 3.');
  if (!res.ok) throw new Error(`Firebase respondió con un error (${res.status}). Revisa la dirección.`);
  cfg = { mode: 'sync', dbUrl: url, room, me: (cfg && cfg.me) || 'a' };
  save(LS.cfg, cfg); pending = []; savePending();
  Sync.start();
}

function obRestore(file) {

}
async function startJoin(j) {

  if (!j || !validFirebaseUrl(j.u) || !validRoom(j.r)) { ob.joinErr = 'El enlace de invitación no tiene un formato válido de Pacto.'; render(); return; }

    const r = await fetchT(`${j.u}/rooms/${j.r}/meta.json`);

    const meta = await r.json();

let rafId = 0, deferred = false;

  if (rafId) return;

}
function renderChrome() {

      const tabs = [['today', 'Hoy', ICON.sun], ['mine', 'Mi semana', ICON.cal], ['theirs', nm(oth(ME())), ICON.users], ['punish', 'Castigos', ICON.scale], ['settings', 'Ajustes', ICON.sliders]];
      nav.innerHTML = tabs.map(([k, n, ic]) => `<button data-act="tab" data-tab="${k}"${ui.tab === k ? ' aria-current="page"' : ''}>${ic}<span class="lbl">${esc(n)}</span>${k === 'punish' && nImpose ? `<span class="badge" aria-label="${nImpose} por imponer">${nImpose}</span>` : ''}</button>`).join('');
      document.title = (nImpose ? `(${nImpose}) ` : '') + 'Pacto · planificador de dos';
    }

function render() {
  const view = $('#view'); if (!view) return;
  const a = document.activeElement;
  if (cfg && a && view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { deferred = true; renderChrome(); return; }
  deferred = false;
  const app = $('#app');
  if (!cfg || ob.step === 'join') { app.classList.add('ob'); renderOnboarding(); renderChrome(); return; }
  app.classList.remove('ob');
  if (cfg.mode === 'sync' && !Sync.ready && !Sync.timedOut) { view.className = ''; view.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; renderChrome(); return; }
  const scroll = window.scrollY;
  let html = '';
  switch (ui.tab) {
    case 'mine': html = viewWeek('mine'); break;
    case 'theirs': html = viewWeek('theirs'); break;
    case 'punish': html = viewPunish(); break;
    case 'settings': html = viewSettings(); break;
    default: html = viewToday();

  view.className = ui.animate ? 'enter' : '';
  view.innerHTML = html;
  ui.animate = false; ui.pop = null;

function tick() {
  const d = todayStr();
  if (d !== ui.day) { ui.day = d; runReview(); scheduleRender(); }
  else if (cfg && Sync.ready && S.lastReview && S.lastReview < addDays(d, -1)) runReview();
}
function boot() {
  renderChrome();
  const m = location.hash.match(/^#j=([A-Za-z0-9_-]+)$/);
  if (m) {
    try { const j = JSON.parse(b64dec(m[1])); if (j && validFirebaseUrl(j.u) && validRoom(j.r)) { Sync.ready = true; startJoin(j); initTimers(); return; } } catch (e) {}
  }
  if (cfg && cfg.mode === 'sync') Sync.start(); else Sync.ready = true;
  if (cfg && Sync.ready) runReview();
  render(); initTimers();
}
function initTimers() {
  setInterval(tick, 15000);
  document.addEventListener('visibilitychange', () => {
